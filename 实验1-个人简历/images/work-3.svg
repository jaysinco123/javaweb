<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="学习数据统计图表示意图">
    <defs>
        <linearGradient id="w3bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e9f7f4" />
            <stop offset="100%" stop-color="#cfeae4" />
        </linearGradient>
    </defs>

    <!-- 背景 -->
    <rect width="480" height="300" fill="url(#w3bg)" />

    <!-- 数据面板 -->
    <rect x="60" y="52" width="360" height="220" rx="14" fill="#ffffff" />

    <!-- 面板标题 -->
    <rect x="88" y="76" width="104" height="10" rx="5" fill="#94a3b8" />
    <rect x="88" y="94" width="64" height="8" rx="4" fill="#e2e8f0" />

    <!-- 网格线 -->
    <rect x="88" y="130" width="308" height="1" fill="#eef2f1" />
    <rect x="88" y="168" width="308" height="1" fill="#eef2f1" />
    <rect x="88" y="206" width="308" height="1" fill="#eef2f1" />

    <!-- 柱状图：每周学习时长 -->
    <rect x="106" y="186" width="32" height="52" rx="7" fill="#a9e0d7" />
    <rect x="164" y="166" width="32" height="72" rx="7" fill="#7dd3c6" />
    <rect x="222" y="146" width="32" height="92" rx="7" fill="#2fa697" />
    <rect x="280" y="126" width="32" height="112" rx="7" fill="#0f766e" />
    <rect x="338" y="158" width="32" height="80" rx="7" fill="#7dd3c6" />

    <!-- 坐标轴 -->
    <rect x="88" y="240" width="308" height="2" fill="#cbd5e1" />

    <!-- 趋势线 -->
    <polyline points="122,178 180,158 238,138 296,118 354,150" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="122" cy="178" r="5" fill="#ffffff" stroke="#f59e0b" stroke-width="3" />
    <circle cx="180" cy="158" r="5" fill="#ffffff" stroke="#f59e0b" stroke-width="3" />
    <circle cx="238" cy="138" r="5" fill="#ffffff" stroke="#f59e0b" stroke-width="3" />
    <circle cx="296" cy="118" r="5" fill="#ffffff" stroke="#f59e0b" stroke-width="3" />
    <circle cx="354" cy="150" r="5" fill="#ffffff" stroke="#f59e0b" stroke-width="3" />
</svg>
